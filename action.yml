name: "Markdown/Word to PDF"
description: >-
  Convert a Markdown or Word (.docx/.doc) file to a PDF.
  Markdown files are first converted to .docx via Pandoc, then the Word
  document is converted to PDF using LibreOffice in headless mode.
  The PDF preserves the document's layout, fonts, and template styling.

branding:
  icon: "file-text"
  color: "blue"

inputs:
  docx_file:
    description: >-
      Path to the source Word document (.docx or .doc) to convert.
      Provide either docx_file or markdown_file (not both).
    required: false
    default: ""
  markdown_file:
    description: >-
      Path to a Markdown file to convert. It will be converted to .docx via
      Pandoc first, then to PDF. Provide either docx_file or markdown_file.
    required: false
    default: ""
  pdf_file:
    description: "Path where the resulting PDF should be written."
    required: true

outputs:
  pdf_file:
    description: "Resolved path to the generated PDF (same as inputs.pdf_file)."
    value: ${{ steps.convert.outputs.pdf_file }}

runs:
  using: "composite"
  steps:
    - name: Resolve source document
      id: resolve
      shell: bash
      run: |
        set -euo pipefail

        DOCX="${{ inputs.docx_file }}"
        MD="${{ inputs.markdown_file }}"

        if [ -n "$MD" ] && [ -n "$DOCX" ]; then
          echo "::error::Provide either 'markdown_file' or 'docx_file', not both."
          exit 1
        fi
        if [ -z "$MD" ] && [ -z "$DOCX" ]; then
          echo "::error::You must provide either 'markdown_file' or 'docx_file'."
          exit 1
        fi

        if [ -n "$MD" ]; then
          if [ ! -f "$MD" ]; then
            echo "::error::Markdown file not found: $MD"
            exit 1
          fi
          echo "source_type=markdown" >> "$GITHUB_OUTPUT"
          echo "md_file=$MD" >> "$GITHUB_OUTPUT"

          # Derive a .docx path next to the markdown file.
          DOCX_DIR="$(dirname "$MD")"
          DOCX_BASE="$(basename "$MD" .md)"
          RESOLVED_DOCX="$DOCX_DIR/$DOCX_BASE.docx"
          echo "docx_file=$RESOLVED_DOCX" >> "$GITHUB_OUTPUT"
        else
          if [ ! -f "$DOCX" ]; then
            echo "::error::Word document not found: $DOCX"
            exit 1
          fi
          echo "source_type=docx" >> "$GITHUB_OUTPUT"
          echo "docx_file=$DOCX" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Pandoc
      if: steps.resolve.outputs.source_type == 'markdown'
      shell: bash
      run: |
        if ! command -v pandoc >/dev/null 2>&1; then
          wget -q https://github.com/jgm/pandoc/releases/download/3.9.0.2/pandoc-3.9.0.2-1-amd64.deb
          sudo dpkg -i pandoc-3.9.0.2-1-amd64.deb
        fi
        pandoc --version

    - name: Convert Markdown to Word
      if: steps.resolve.outputs.source_type == 'markdown'
      shell: bash
      run: |
        set -euo pipefail
        pandoc "${{ steps.resolve.outputs.md_file }}" \
          -o "${{ steps.resolve.outputs.docx_file }}"
        echo "Converted ${{ steps.resolve.outputs.md_file }} -> ${{ steps.resolve.outputs.docx_file }}"

    - name: Install LibreOffice
      shell: bash
      run: |
        if ! command -v soffice >/dev/null 2>&1 && ! command -v libreoffice >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer
        fi

    - name: Install Microsoft fonts and Calibri substitute
      shell: bash
      run: |
        # Microsoft TrueType core fonts (Arial/Times/Verdana/...).
        if ! fc-list 2>/dev/null | grep -qi 'Arial'; then
          sudo apt-get update
          echo "msttcorefonts/accepted-mscorefonts-eula boolean true" | sudo debconf-set-selections
          sudo apt-get install -y ttf-mscorefonts-installer
          sudo fc-cache -f >/dev/null 2>&1 || true
        fi
        # Carlito is the metric-compatible substitute for Calibri (not in free MS core-fonts).
        if ! fc-list 2>/dev/null | grep -qi 'Carlito'; then
          sudo apt-get install -y fonts-crosextra-carlito
        fi
        sudo tee /etc/fonts/conf.d/99-calibri-carlito.conf >/dev/null <<'XML'
        <?xml version="1.0"?>
        <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
        <fontconfig>
          <match target="pattern">
            <test name="family"><string>Calibri</string></test>
            <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
          </match>
        </fontconfig>
        XML
        sudo fc-cache -f >/dev/null 2>&1 || true

    - name: Fix DOCX table widths and styles
      shell: bash
      run: |
        python3 "${{ github.action_path }}/fix-docx-tables.py" "${{ steps.resolve.outputs.docx_file }}"

    - name: Convert Word document to PDF
      id: convert
      shell: bash
      run: |
        set -euo pipefail

        SRC="${{ steps.resolve.outputs.docx_file }}"
        DEST="${{ inputs.pdf_file }}"

        if [ ! -f "$SRC" ]; then
          echo "::error::Source document not found: $SRC"
          exit 1
        fi

        # Ensure the destination directory exists.
        mkdir -p "$(dirname "$DEST")"
        DEST="$(cd "$(dirname "$DEST")" && pwd)/$(basename "$DEST")"

        OUTDIR="$(cd "$(dirname "$DEST")" && pwd)"
        BASE="$(basename "$DEST" .pdf)"

        # LibreOffice writes "<basename>.pdf" into OUTDIR. We give it the
        # desired base name by temporarily copying the source if needed.
        SRC_NAME="$(basename "$SRC")"
        SRC_BASE="${SRC_NAME%.*}"
        SRC_EXT="${SRC_NAME##*.}"

        WORK=""
        if [ "$SRC_BASE" != "$BASE" ]; then
          WORK="$(mktemp -d)"
          cp "$SRC" "$WORK/$BASE.$SRC_EXT"
          SRC_TO_CONVERT="$WORK/$BASE.$SRC_EXT"
        else
          SRC_TO_CONVERT="$SRC"
        fi

        # Run headless conversion. A clean per-run profile avoids lock
        # contention when multiple conversions run on the same runner.
        PROFILE="$(mktemp -d)"
        soffice --headless \
          --nofirststartwizard \
          --norestore \
          --invisible \
          -env:UserInstallation="file://$PROFILE" \
          --convert-to pdf \
          --outdir "$OUTDIR" \
          "$SRC_TO_CONVERT"
        rm -rf "$PROFILE" "$WORK" 2>/dev/null || true

        GENERATED="$OUTDIR/$BASE.pdf"
        if [ ! -f "$GENERATED" ]; then
          echo "::error::LibreOffice did not produce $GENERATED"
          exit 1
        fi

        # If the generated file landed at a different path than requested
        # (e.g. source basename differed), move it into place.
        if [ "$GENERATED" != "$DEST" ]; then
          mv -f "$GENERATED" "$DEST"
        fi

        echo "pdf_file=$DEST" >> "$GITHUB_OUTPUT"
        echo "Converted $SRC -> $DEST"
