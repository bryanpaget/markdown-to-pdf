name: Build Sample Artifacts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  build:
    name: Build sample artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc

      - name: Build DOCX from markdown
        run: |
          pandoc samples/complex-document.md \
            --resource-path=samples \
            -o samples/complex-document.docx

      - name: Fix DOCX table widths and styles
        run: |
          python3 lib/fix-docx.py samples/complex-document.docx

      - name: Build PDF from DOCX
        uses: ./
        with:
          docx_file: samples/complex-document.docx
          pdf_file: samples/complex-document-from-docx.pdf
          code_block_style: "true"
          page_breaks: "sections"
          font: "arial"

      - name: Build PDF from markdown
        uses: ./
        with:
          markdown_file: samples/complex-document.md
          pdf_file: samples/complex-document-from-markdown.pdf
          code_block_style: "true"
          page_breaks: "sections"
          font: "arial"

      - name: Install screenshot tools
        run: |
          sudo apt-get install -y -qq poppler-utils imagemagick

      - name: Generate comparison screenshot
        run: |
          for p in 2 7 9; do
            pdftoppm -png -f "$p" -l "$p" -r 130 \
              samples/complex-document-from-docx.pdf \
              "/tmp/screen-$p"
          done
          montage /tmp/screen-*.png \
            -tile 1x3 -geometry "700x" -border 6 -bordercolor white \
            assets/screenshot-comparison.png

      - name: Commit updated screenshot
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/screenshot-comparison.png
          git diff --cached --quiet || git commit -m "Update comparison screenshot [skip ci]"
          git push origin "${{ github.ref_name }}"

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          cp samples/complex-document.md       release-assets/complex-document-source.md
          cp samples/complex-document.docx     release-assets/complex-document.docx
          cp samples/complex-document-from-docx.pdf      release-assets/complex-document-from-docx.pdf
          cp samples/complex-document-from-markdown.pdf  release-assets/complex-document-from-markdown.pdf
          cp assets/screenshot-comparison.png  release-assets/screenshot-comparison.png

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sample-artifacts
          path: release-assets/*
          compression-level: 0

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body \
            "**Sample artifacts** built from this PR — download from the
             [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

  release:
    name: Publish release page
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: sample-artifacts
          path: release-assets

      - name: Create release tag
        run: |
          TAG="v$(date +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "created at $(date)" >> /tmp/release-body.md
        id: tag

      - name: Create and upload release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release create "$TAG" \
            release-assets/* \
            --title "v$(date +'%Y%m%d') — Sample Document Build" \
            --notes "Pre-built sample artifacts demonstrating the markdown-to-PDF conversion pipeline.

            | File | Description |
            |------|-------------|
            | \`complex-document-source.md\` | Original markdown source with tables, code blocks, lists, blockquotes, and embedded financial charts |
            | \`complex-document.docx\` | Intermediate DOCX produced by Pandoc |
            | \`complex-document-from-docx.pdf\` | PDF rendered via DOCX → LibreOffice |
            | \`complex-document-from-markdown.pdf\` | PDF rendered via Markdown → Pandoc → LibreOffice |
            | \`screenshot-comparison.png\` | First-page rendering of the feature-rich PDF |

            Generate these locally with:
            \`\`\`
            pandoc samples/complex-document.md --resource-path=samples -o document.docx
            python3 lib/fix-docx.py document.docx
            soffice --headless --convert-to pdf document.docx
            \`\`\`"
